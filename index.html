px 7vw 25px}.art{height:160px}.art:before{font-size:100px}.quick{position:static;padding:10px;max-width:none}.stage{min-height:70vh}}
.art:before{display:none!important}.art{overflow:hidden;padding:0;background:#071e35}.art img{display:block}video{background:#071e35}.stage.text-only{grid-template-columns:minmax(0,1fr)}.stage.text-only .art{display:none!important}#intro:empty{display:none}.art{height:auto;min-width:0}.art img{max-height:65vh!important}@media(max-width:800px){.stage{padding-top:32px}.art img{max-height:45vh!important}}</style></head><body><header><strong>IKIGAI WELLNESS</strong><span>S.A.S. de C.V. · Programa corporativo</span></header><main class="stage"><section><div class="eyebrow" id="tag"></div><h1 id="title"></h1><p id="body"></p><p id="intro"></p><div class="foot" id="note"></div></section><div class="art"><span>PREVENCIÓN · ATENCIÓN · RENDIMIENTO</span></div></main><nav><button id="narration" type="button" hidden>Escuchar narración</button><span id="voice-status" role="status"></span><span class="count" id="count"></span><button id="next-slide" type="button">Siguiente →</button><a class="cta" href="https://wa.me/523223227029?text=Hola%2C%20quiero%20conocer%20el%20programa%20corporativo%20de%20Ikigai%20Wellness" target="_blank">Solicitar propuesta por WhatsApp</a></nav><script>
const embeddedImages=['medios/recurso_01.png', 'medios/recurso_02.jpg', 'medios/recurso_03.png', 'medios/recurso_04.png', 'medios/recurso_05.jpg', 'medios/recurso_06.png'];
const assets={"10":"medios/diapositiva-10.webp","11":"medios/diapositiva-11.webp","portada":"medios/recurso_08.png","02":"medios/diapositiva-02.webp","03":"medios/diapositiva-03.webp","04":"medios/diapositiva-04.webp","05":"medios/diapositiva-05-v2.webp","06":"medios/diapositiva-06.webp","07":"medios/diapositiva-07.webp","08":"medios/diapositiva-08.webp","09":"medios/diapositiva-09-v2.webp"};


const slides=[
['IKIGAI WELLNESS','Salud ocupacional y rendimiento',"Prevención de lesiones y atención física directamente en tu empresa.",'audio_portada_extraido',['portada'],[]],
['EL RETO','Cuando el dolor afecta el trabajo',"Cuando un colaborador trabaja con dolor, tareas como atender a clientes, permanecer de pie o repetir un movimiento pueden volverse más difíciles. Por eso empezamos por conocer qué puestos y actividades requieren atención.",'dolor_audio_actualizado',['02'],[]],
['NUESTRA SOLUCIÓN','La atención llega al lugar de trabajo',"Organizamos el servicio en sus instalaciones y coordinamos las visitas con los responsables de cada área. Así podemos adaptar las sesiones a los turnos, al espacio y a las necesidades de su equipo.",null,['03'],[]],
['SERVICIO 01','Pausas activas exprés',"Guiamos pausas breves de movilidad y estiramiento durante la jornada. Podemos ajustar los ejercicios a las tareas de cada área y al tiempo disponible.",'Pausas activas.m4a',['04'],[]],
['SERVICIO 02','Clínica de descarga in situ',"Instalamos una clínica de descarga muscular dentro de su empresa. Nuestro equipo ofrece sesiones de terapia manual en silla ergonómica o camilla, en un espacio privado acordado con ustedes.",'Clínica de descarga in sutu.m4a',['05'],[]],
['SERVICIO 03','Terapia física y rehabilitación',"Cuando un colaborador necesita atención individual, el fisioterapeuta realiza una valoración funcional y orienta la intervención y el seguimiento según lo que encuentre.",'Terapia Física y rehabilitación.m4a',['06'],[]],
['SERVICIO 04','Red de canalización psicológica',"A través de nuestra red de canalización, los colaboradores pueden acceder a profesionales de atención psicológica. Su equipo de Recursos Humanos puede compartir esta opción con quienes deseen solicitar apoyo.",'Atención psicológica.m4a',['07'],[]],
['SEGUIMIENTO','Reportes para tomar decisiones',"Entregamos reportes de participación, servicios realizados y hallazgos generales. Con ellos, su equipo puede revisar el uso del programa y decidir qué áreas conviene priorizar en las siguientes visitas.",'Entrega de reportes.m4a',['08'],[]],
['EXPERIENCIA','Trayectoria que respalda la propuesta',"Hemos implementado programas de salud ocupacional con ManpowerGroup en Ciudad de México y con Toyota en Puerto Vallarta y Tepic. Esa experiencia nos ayuda a coordinar jornadas en empresas con distintos espacios y turnos.",null,['09'],[]],
['EVENTOS DEPORTIVOS','Clínica de descarga muscular en carreras deportivas',"Ofrecemos terapia física y rehabilitación deportiva en eventos deportivos. Usted puede ser nuestro patrocinador y ayudarnos a llevar la clínica de descarga muscular a más participantes.",null,['10'],[]],
['SIGUIENTE PASO','Agendemos una visita',"Le propongo agendar una visita para conocer sus instalaciones, conversar sobre las necesidades de su equipo y definir una primera jornada. Puede escribirnos por WhatsApp para acordar una fecha.",null,['11'],[]]
];
let i=0;

function go(n){
 
 document.querySelectorAll('.art video').forEach(v=>{v.pause();v.removeAttribute('src');v.load();});
 i=(n+slides.length)%slides.length;let a=slides[i];
 document.getElementById('tag').textContent=a[0];document.getElementById('title').textContent=a[1];document.getElementById('body').textContent=a[2];document.getElementById('count').textContent=(i+1)+' / '+slides.length;
 document.getElementById('intro').textContent=i===0?"En Ikigai Wellness llevamos servicios de salud ocupacional a su empresa para ayudar a prevenir lesiones y atender molestias físicas durante la jornada laboral.":'';
 
 const art=document.querySelector('.art');art.replaceChildren();art.hidden=!a[4].length&&!a[5].length;art.closest('.stage').classList.toggle('text-only',art.hidden);art.style.cssText='display:flex;justify-content:center;align-items:center;padding:8px';
 for(const key of a[4]){let el=document.createElement('img');el.src=assets[key];el.alt=a[1];el.style.cssText='width:100%;max-height:100%;min-height:0;object-fit:contain;border-radius:14px;flex:1 1 40%';if(i===4)el.style.cssText='width:100%;max-height:65vh;object-fit:contain;border-radius:14px';art.appendChild(el)}
 document.getElementById('note').textContent=i===7?'Los resultados se presentan como indicadores a medir, no como ahorros garantizados.':'';
}
const synth = window.speechSynthesis;
const narration = document.getElementById('narration');
let timer;
let reading = false;
let activeSpeech;
let voice;
function preferredVoice(voices){
  const names = /\b(dalia|sabina|elvira|paloma|helena|laura|monica|paulina|angelica|juanita|ines|soledad|valentina|salome|ximena|isabella|lorena|renata|female|mujer)\b/i;
  const candidates = voices.filter(v => /^es(?:[-_]|$)/i.test(v.lang)
    && names.test(v.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '')));
  const natural = v => /natural|neural|premium|enhanced/i.test(v.name);
  const mexican = v => /^es[-_]mx$/i.test(v.lang);
  return candidates.find(v => mexican(v) && natural(v))
    || candidates.find(natural) || candidates.find(mexican) || candidates[0];
}

let musicContext;
let musicBus;

function stopMusic(){
  if(!musicBus) return;
  const now = musicContext.currentTime;
  const gain = musicBus.gain;
  gain.cancelAndHoldAtTime(now);
  gain.setTargetAtTime(0, now, 0.025);
  musicBus = undefined;
}

function playPiano(closing = false){
  const AudioEngine = window.AudioContext || window.webkitAudioContext;
  if(!AudioEngine) return 0;
  stopMusic();
  try {
    musicContext ||= new AudioEngine();
    musicContext.resume().catch(() => {});
    const bus = musicContext.createGain();
    musicBus = bus;
    bus.connect(musicContext.destination);
    const start = musicContext.currentTime + 0.035;
    const duration = closing ? 4.2 : 2.9;
    bus.gain.setValueAtTime(0, start);
    bus.gain.linearRampToValueAtTime(0.21, start + 0.22);
    bus.gain.setValueAtTime(0.21, start + duration - 0.8);
    bus.gain.linearRampToValueAtTime(0, start + duration);
    const notes = closing
      ? [[48,0],[55,0.2],[60,0.42],[64,0.65],[69,1.05],[67,1.52],[64,1.92],[60,2.35],[55,2.62]]
      : [[48,0],[55,0.18],[60,0.38],[64,0.58],[67,0.95],[69,1.32],[64,1.65],[62,1.93]];
    for(const [note, offset] of notes){
      const at = start + offset;
      const tone = musicContext.createOscillator();
      const envelope = musicContext.createGain();
      tone.setPeriodicWave(musicContext.createPeriodicWave(
        new Float32Array(5), new Float32Array([0, 1, 0.24, 0.08, 0.035])
      ));
      tone.frequency.value = 440 * 2 ** ((note - 69) / 12);
      envelope.gain.setValueAtTime(0, at);
      envelope.gain.linearRampToValueAtTime(0.16, at + 0.012);
      envelope.gain.exponentialRampToValueAtTime(0.001, at + 1.3);
      tone.connect(envelope);
      envelope.connect(bus);
      tone.start(at);
      tone.stop(at + 1.32);
    }
    return (duration + 0.13) * 1000;
  } catch {
    return 0;
  }
}

function playSlide(index){
  clearTimeout(timer);
  go(index);
  nextSlide.disabled = index === slides.length - 1;
  const slide = slides[index];
  const intro = document.getElementById('intro').textContent;
  const text = (index === 0 ? [slide[1], intro] : [slide[1], slide[2]]).join('. ');
  const delay = Math.max(15000, text.trim().split(/\s+/).length * 500 + 3000);
  function advance(){
    if(index < slides.length - 1) playSlide(index + 1);
    else {
      if(reading) playPiano(true);
      reading = false;
      narration.textContent = 'Escuchar de nuevo';
    }
  }
  if(!reading){
    if(index < slides.length - 1) timer = setTimeout(advance, delay);
    return;
  }

  const speech = new SpeechSynthesisUtterance(text);
  activeSpeech = speech;
  speech.voice = voice;
  speech.lang = voice.lang;
  speech.rate = 0.97;
  speech.onend = () => {
    if(activeSpeech !== speech) return;
    clearTimeout(timer);
    timer = setTimeout(advance, 800);
  };
  function continueSilently(){
    if(activeSpeech !== speech) return;
    activeSpeech = undefined;
    clearTimeout(timer);
    reading = false;
    narration.textContent = 'Escuchar narración';
    timer = setTimeout(advance, delay);
  }
  speech.onerror = event => {
    if(activeSpeech === speech && event.error === 'not-allowed'){
      status.textContent = 'Pulsa Escuchar narración para activar el audio.';
    }
    continueSilently();
  };
  timer = setTimeout(continueSilently, delay + 15000);
  synth.speak(speech);
}

const nextSlide = document.getElementById('next-slide');
const status = document.getElementById('voice-status');
const supportsNarration = synth && 'SpeechSynthesisUtterance' in window;
let autoPending = Boolean(supportsNarration);

function stopCurrentAudio(){
  clearTimeout(timer);
  activeSpeech = undefined;
  if(synth) synth.cancel();
  stopMusic();
}

function startNarration(index){
  stopCurrentAudio();
  reading = true;
  narration.textContent = 'Silenciar narración';
  go(index);
  nextSlide.disabled = index === slides.length - 1;
  const introDuration = index === 0 ? playPiano() : 0;
  if(introDuration && musicContext.state === 'running'){
    timer = setTimeout(() => playSlide(index), introDuration);
  } else if(introDuration && navigator.userActivation?.hasBeenActive){
    timer = setTimeout(() => playSlide(index), introDuration);
  } else {
    stopMusic();
    playSlide(index);
  }
}

nextSlide.addEventListener('click', () => {
  autoPending = false;
  if(i >= slides.length - 1) return;
  stopCurrentAudio();
  playSlide(i + 1);
});
playSlide(0);

if(supportsNarration){
  narration.hidden = false;
  narration.addEventListener('click', () => {
    autoPending = false;
    status.textContent = '';
    if(reading){
      stopCurrentAudio();
      reading = false;
      narration.textContent = 'Escuchar narración';
      playSlide(i);
      return;
    }
    voice = preferredVoice(synth.getVoices());
    if(!voice){
      status.textContent = 'Este navegador no ofrece una voz femenina en español para la narración.';
      return;
    }
    startNarration(narration.textContent === 'Escuchar de nuevo' ? 0 : i);
  });

  function tryAutoplay(){
    if(!autoPending || i !== 0) return;
    voice = preferredVoice(synth.getVoices());
    if(!voice) return;
    autoPending = false;
    synth.removeEventListener('voiceschanged', tryAutoplay);
    startNarration(0);
  }
  synth.addEventListener('voiceschanged', tryAutoplay);
  tryAutoplay();
}
</script></body></html>
